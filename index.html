<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wace, Roman de Brut</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
  <style>
    :root { --line: #e5e7eb; --muted: #6b7280; --accent: #1d4ed8; }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: 'Source Serif 4', ui-serif, Georgia, 'Times New Roman', serif;
      margin: 0 auto;
      padding: 24px;
      max-width: 800px;
      line-height: 1.5;
    }
    h1 { margin: 0 0 8px 0; font-weight: 600; font-size: clamp(1.4rem, 4.5vw, 2rem); }
    .meta { color: #666; margin-bottom: 24px; font-size: 0.95rem; }
    ul { list-style: none; margin: 0; padding: 0; }
    li { margin-bottom: 10px; }
    a.card {
      display: block;
      padding: 14px 16px;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: inherit;
      text-decoration: none;
    }
    a.card:hover, a.card:focus-visible { border-color: var(--accent); }
    .card-title { font-weight: 600; font-size: 1.1rem; color: var(--accent); }
    .card-desc { color: var(--muted); font-size: 0.95rem; margin-top: 2px; }
    @media (max-width: 600px) { body { padding: 12px; } }
  </style>
</head>
<body>
  <h1>Wace, <em>Roman de Brut</em></h1>
  <div class="meta">vv. 733-773</div>
  <ul>
    <li>
      <a class="card" href="wace.html">
        <div class="card-title">Glossario</div>
        <div class="card-desc">Glossario dei vv. 733-773, con categoria grammaticale e traduzione.</div>
      </a>
    </li>
  </ul>
</body>
</html>
